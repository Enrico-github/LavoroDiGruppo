<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Cambia Colore Riquadro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cambia il colore del riquadro</h1>
    <div class="buttons">
      <button class="color-btn red" data-color="red">Rosso</button>

    <div id="box" class="box"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
