<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <p>Informatica 4F</p>

    <p class="classTestCSS">TestClasseCSS2</p>
    <h1 class="classTestCSS">TestClasseCSS3</h1><!--Tutti i tag con stessa classe assegnata otterranno le stesse modifiche-->
    <h2 class="classTestCSS">TestClasseCSS4</h2>
    <span>ciao, ciao</span>
    <span>buongiorno, buongiorno</span>
    <h1>Sono di tipo <span>blocco</span></h1>
    <div>Test</div><!--Il tag div è un tag di tipo blocco, quindi occupa tutta la larghezza disponibile-->
    <span id="boxModelID">Test2</span>
    <div>
        <p>Menu 1</p>
        <p>Menu 2</p>
        <p>Menu 3</p>
        <p>Menu 4</p>
